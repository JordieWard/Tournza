:root{
  --ink:#050B1A; --ink-2:#081227; --surface:#0E1A33; --surface-2:#13244A; --line:rgba(77,141,255,.22); --line-2:rgba(77,141,255,.38);
  --ivory:#EDF2FF; --ivory-dim:#B9C8EF; --muted:#7D8DB8; --muted-2:#98A7CF;
  --blue:#3678FF; --blue-2:#5B93FF; --cyan:#19D3F3; --pink:#F53678; --green:#2FD27C; --amber:#FFB020; --red:#FF5C7A;
  --btn-blue:linear-gradient(180deg,#3E86FF,#1F62F7); --glow-blue:0 10px 28px -12px rgba(40,110,255,.9);
  --display:"Archivo",system-ui,sans-serif; --body:"Hanken Grotesk",system-ui,sans-serif; --mono:"DM Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}   /* .ad-app / .ad-modal set their own display — hidden must still win */
html,body{margin:0;background:var(--ink);color:var(--ivory);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 600px at 85% -10%,rgba(54,120,255,.16),transparent 60%),linear-gradient(115deg,var(--ink) 0%,#060E22 60%,#071433 100%) fixed}
a{color:var(--blue-2)}
button{font:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ad-muted{color:var(--muted-2)}
.mono{font-family:var(--mono)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* ---- logo (the site's own wordmark) ---- */
.ad-logo{display:block;width:150px;aspect-ratio:473/110;background:var(--tz-logo) left center/contain no-repeat}

/* ---- gate (sign in / no access / 6-digit code) ---- */
.ad-boot{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.ad-card{background:linear-gradient(180deg,rgba(22,40,80,.92),rgba(12,24,48,.95));border:1px solid var(--line-2);border-radius:14px;box-shadow:0 30px 80px -40px rgba(0,0,0,.9)}
.ad-gate{width:min(460px,100%);padding:30px 28px;text-align:left}
.ad-gate .ad-logo{width:170px;margin-bottom:18px}
.ad-kicker{margin:0 0 14px;font:500 11px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--cyan)}
.ad-gate h1{margin:0 0 8px;font:900 26px/1.1 var(--display);text-transform:uppercase;letter-spacing:-.01em}
.ad-gate p{margin:0 0 14px}
.ad-qr{display:grid;place-items:center;background:#fff;border-radius:10px;padding:10px;width:200px;margin:6px 0 12px}
.ad-qr img{width:180px;height:180px}
.ad-secret{font:500 12.5px/1.4 var(--mono);word-break:break-all;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0 0 14px}
.ad-code{font:700 26px/1 var(--mono);letter-spacing:.35em;text-align:center;width:100%;padding:14px 10px;border-radius:10px;border:1px solid var(--line-2);background:#0A1530;color:#fff}
.ad-err{color:var(--red);font-size:13.5px;min-height:1.2em;margin:8px 0 0}
.ad-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---- buttons, inputs ---- */

<script>window.TZ_SUPABASE_URL = "https://uwojmyggmacoxrdolstb.supabase.co"; window.TZ_SUPABASE_KEY = "sb_publishable_HhQl-E4KZFnwuSSA_J_JXQ_cIQbilr-";</script>
<script>
/* Tournza Admin Control Centre — Phase 1 (views + admin users) + Phase 2 (actions: admin-ops.js).
   Security lives in the database: every admin_* function checks the caller's admin role and the second
   login step (aal2). This file only decides what to show; it never holds a secret (the key below is the
   site's public key, the same one every Tournza page uses). */
(function(){
  const SUPABASE_URL = window.TZ_SUPABASE_URL, SUPABASE_KEY = window.TZ_SUPABASE_KEY;
  const A = { sb:null, me:null, view:'overview', timer:null, list:null, filter:'today', q:'', busy:false };
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const can = p => !!(A.me && A.me.permissions && (A.me.permissions.includes('*') || A.me.permissions.includes(p)));
  const money = p => '£' + (Number(p || 0) / 100).toFixed(2);
  const day = iso => { if(!iso) return '—'; const d = new Date(String(iso).slice(0,10) + 'T12:00:00'); return d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short', year:'numeric' }); };
  const when = iso => iso ? new Date(iso).toLocaleString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : '—';
  const badge = (s, label) => `<span class="ad-b ${esc(String(s || '').replace(/\W+/g,'_'))}">${esc(label || s || '—')}</span>`;
  const STAGE = { group:'Group', r16:'Last 16', qf:'Quarter-final', sf:'Semi-final', final:'Final' };
  const OUTCOME = { winner:'Winner', runner_up:'Runner-up', sf:'Semi-final', qf:'Quarter-final', r16:'Last 16', group:'Group stage' };

  function toast(msg, bad){ const t = $('#ad-toast'); t.textContent = msg; t.classList.toggle('bad', !!bad); t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(()=>t.classList.remove('show'), 3800); }
  function friendly(err){
    const m = (err && (err.message || err.error_description || err)) + '';
    if(/approved one/i.test(m)) return 'This account’s authenticator isn’t the approved one — an owner has to approve it again.';
    if(/6-digit|aal2|mfa/i.test(m)) return 'Enter your 6-digit admin code again.';
    if(/Not authorised|permission denied|42501/i.test(m)) return 'Your admin role doesn’t allow this.';
    if(/fetch|network|Failed to/i.test(m)) return 'Couldn’t reach the server — check your connection and try again.';
    return m.replace(/^Error:\s*/, '');
  }
  async function rpc(name, args){
    const { data, error } = await A.sb.rpc(name, args || {});
    if(error){ if(/6-digit|mfa|approved one/i.test(error.message || '')) { A.me = null; boot(); } throw error; }
    return data;
  }

  // ---------------- gate: sign in → admin? → 6-digit code ----------------
  function gate(html){ $('#ad-app').hidden = true; $('#ad-boot').hidden = false; $('#ad-gate-body').innerHTML = html; }
  async function boot(){
    clearInterval(A.timer);
    if(typeof supabase === 'undefined' || !SUPABASE_URL){ gate('<h1>Can’t load</h1><p class="ad-muted">The sign-in service didn’t load. Check your connection and refresh.</p>'); return; }
    A.sb = A.sb || supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const { data:{ session } } = await A.sb.auth.getSession();
    if(!session){
      gate(`<h1>Sign in</h1><p class="ad-muted">Use your Tournza account. Admin access is switched on for named accounts only.</p>
        <a class="ad-btn block" href="login.html?next=${encodeURIComponent('/admin.html' + location.hash)}">Sign in</a>`);
      return;
    }
    let me;
    try{ me = await rpc('admin_me'); }catch(e){ gate(`<h1>Can’t check access</h1><p class="ad-err">${esc(friendly(e))}</p><button class="ad-btn" onclick="location.reload()">Try again</button>`); return; }
    if(me && me.pending){
      // added but not switched on yet: the only thing they can do here is set up their code
      if(me.mfa_required && !me.mfa_ok){ await mfaGate(); return; }
      gate(`<h1>Code set up — waiting for approval</h1><p class="ad-muted">Your 6-digit code is set up. An owner now checks it and switches your admin access on. Nothing else to do here for now.</p>
        <div class="ad-row"><a class="ad-btn ghost" href="/">Back to Tournza</a><button class="ad-btn ghost" data-ad-signout>Sign out</button></div>`);
      return;
    }
    if(!me || !me.admin){
      gate(`<h1>No admin access</h1><p class="ad-muted">This account isn’t an admin. If it should be, ask an owner to add it.</p>
        <div class="ad-row"><a class="ad-btn ghost" href="/">Back to Tournza</a><button class="ad-btn ghost" data-ad-signout>Sign out</button></div>`);
      return;
    }
    A.me = me;
    if(me.mfa_mismatch){
      gate(`<h1>Admin access paused</h1><p class="ad-muted">This account’s authenticator isn’t the one that was approved (a code was added or changed). For safety, admin access stays off until an owner checks it and approves it again.</p>
        <p class="ad-muted">If you didn’t change your authenticator, tell an owner straight away and change your password.</p>
        <div class="ad-row"><a class="ad-btn ghost" href="/">Back to Tournza</a><button class="ad-btn ghost" data-ad-signout>Sign out</button></div>`);
      return;
    }
    if(me.mfa_required && !me.mfa_ok){ await mfaGate(); return; }
    start();
  }

  async function mfaGate(){
    let factors;
    try{ const r = await A.sb.auth.mfa.listFactors(); if(r.error) throw r.error; factors = r.data; }catch(e){ gate(`<h1>Second step</h1><p class="ad-err">${esc(friendly(e))}</p>`); return; }
    const verified = (factors.totp || []).find(f => f.status === 'verified');
    if(verified){
      gate(`<h1>Admin code</h1><p class="ad-muted">Open your authenticator app and enter the 6-digit code for Tournza.</p>
        <form id="ad-mfa"><label class="sr" for="ad-code">6-digit code</label><input class="ad-code" id="ad-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
        <p class="ad-err" id="ad-mfa-err"></p><button class="ad-btn block" type="submit">Continue</button></form>
        <p class="ad-warn" style="margin-top:14px;font-size:13px"><b>Never set up a Tournza admin code before?</b> Stop here and tell the owner straight away — someone else may have set one up on your account.</p>
        <p class="ad-muted" style="margin-top:8px;font-size:13px">Lost your phone? An owner can’t reset this from here — contact Tournza support.</p>`);
      $('#ad-code').focus();
      $('#ad-mfa').onsubmit = ev => { ev.preventDefault(); verify(verified.id); };
      return;
    }
    // first time: set up the authenticator (drop any half-finished set-up first)
    for(const f of (factors.all || []).filter(f => f.status !== 'verified')){ try{ await A.sb.auth.mfa.unenroll({ factorId: f.id }); }catch(_){} }
    const { data, error } = await A.sb.auth.mfa.enroll({ factorType:'totp', friendlyName:'Tournza admin' });
    if(error){ gate(`<h1>Second step</h1><p class="ad-err">${esc(friendly(error))}</p>`); return; }
    gate(`<h1>Set up your admin code</h1>
      <p class="ad-muted">Admin pages need a second step. Scan this with an authenticator app (Google Authenticator, Microsoft Authenticator, 1Password…), then type the 6-digit code it shows.</p>
      <div class="ad-qr"><img alt="QR code to add Tournza to your authenticator app" src="${esc(data.totp.qr_code)}"></div>
      <p class="ad-muted" style="font-size:13px;margin-bottom:6px">Can’t scan? Enter this key instead:</p><div class="ad-secret">${esc(data.totp.secret)}</div>
      <form id="ad-mfa"><label class="sr" for="ad-code">6-digit code</label><input class="ad-code" id="ad-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
      <p class="ad-err" id="ad-mfa-err"></p><button class="ad-btn block" type="submit">Turn it on</button></form>`);
    $('#ad-mfa').onsubmit = ev => { ev.preventDefault(); verify(data.id); };
  }
  async function verify(factorId){
    const code = ($('#ad-code').value || '').replace(/\D/g,''), btn = $('#ad-mfa button'), errEl = $('#ad-mfa-err');
    if(code.length !== 6){ errEl.textContent = 'Enter the 6 digits.'; return; }
    btn.disabled = true; errEl.textContent = '';
    const { error } = await A.sb.auth.mfa.challengeAndVerify({ factorId, code });
    btn.disabled = false;
    if(error){ errEl.textContent = /invalid|expired/i.test(error.message || '') ? 'That code didn’t work — check it and try again (codes change every 30 seconds).' : friendly(error); $('#ad-code').select(); return; }
    A.me = null; boot();
  }

  // ---------------- shell ----------------

  }
  window.addEventListener('hashchange', ()=>{ if(A.me && !$('#ad-app').hidden) route(); });
  function route(){
    const h = decodeURIComponent(location.hash.replace(/^#/, '')) || 'overview';
    const [v, arg] = h.split(':');
    A.view = ['overview','tournaments','tournament','audit','admins','players','player','payments','pictures'].includes(v) ? v : 'overview';
    if(A.view === 'audit' && !can('audit.view')) A.view = 'overview';
    if((A.view === 'players' || A.view === 'player') && !can('players.view')) A.view = 'overview';
    if(A.view === 'payments' && !can('payments.view')) A.view = 'overview';
    if(A.view === 'pictures' && !can('pictures.review')) A.view = 'overview';
    if(A.view === 'admins' && !can('admins.manage')) A.view = 'overview';
    A.arg = arg || null;
    document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === (A.view === 'tournament' ? 'tournaments' : A.view === 'player' ? 'players' : A.view)));
    render();
  }
  async function render(quiet){
    const box = $('#ad-view');

    try{
      if(A.view === 'overview') box.innerHTML = await viewOverview();
      else if(A.view === 'tournaments') box.innerHTML = await viewTournaments();
      else if(A.view === 'tournament') box.innerHTML = await viewTournament(A.arg);
      else if(A.view === 'audit') box.innerHTML = await viewAudit();
      else if(A.view === 'admins') box.innerHTML = await viewAdmins();
      else if(A.view === 'players') box.innerHTML = await viewPlayers();
      else if(A.view === 'player') box.innerHTML = await viewPlayer(A.arg);
      else if(A.view === 'payments') box.innerHTML = await viewPayments();

        <td><div>${esc(r.reason || '')}</div>${r.before || r.after ? `<details class="ad-d"><summary>Before → after</summary><pre>${esc(JSON.stringify(r.before))} → ${esc(JSON.stringify(r.after))}</pre></details>` : ''}<div class="sm mono">ref ${esc(String(r.ref).slice(0,8))}</div></td></tr>`).join('')}
      </tbody></table></div>` : `<div class="ad-clear">No admin actions yet.</div>`;
    return h;
  }

  // ---------------- Admin users (owners) ----------------
  async function viewAdmins(){

    A.roles = roles;

      <div class="ad-links"><button type="button" class="ad-btn" data-add-admin>Add an admin</button></div>`;
    h += `<div class="ad-tw"><table class="ad-t"><thead><tr><th>Person</th><th>Role</th><th>Status</th><th>6-digit code</th><th class="hide-s">Added</th><th></th></tr></thead><tbody>
      ${list.map(a => `<tr><td><b>${esc(a.name)}</b>${a.you ? ' <span class="ad-b ok">You</span>' : ''}<div class="sm">${esc(a.email)}</div></td><td>${esc(a.label)}</td>
        <td>${a.active ? badge('ok','Active') : a.pending ? badge('open', a.mfa_codes === 1 ? 'Ready to switch on' : 'Waiting for code') : badge('cancelled','Off')}</td>
        <td>${a.mfa_status === 'none' ? '<span class="ad-muted sm">Not set up yet</span>'
            : a.mfa_status === 'extra' ? badge('refund_due', a.mfa_codes + ' codes') + '<div class="sm">Must be exactly one — check</div>'
            : a.mfa_status === 'ok' ? badge('ok','Approved') + '<div class="sm">set up ' + esc(when(a.mfa_latest)) + '</div>'
            : (a.active ? badge('refund_due','Changed') + '<div class="sm">Not the approved one — access paused</div>' : badge('open','Set up') + '<div class="sm">' + esc(when(a.mfa_latest)) + ' — check with them</div>')}</td><td class="sm hide-s">${esc(when(a.added_at))}${a.added_by ? '<div>by ' + esc(a.added_by) + '</div>' : ''}</td>
        <td>${a.you ? '' : `<button type="button" class="ad-btn ghost sm" data-edit-admin="${esc(a.email)}" data-role="${esc(a.role)}" data-active="${a.active}">Change</button>`}</td></tr>`).join('')}
      </tbody></table></div>`;
    h += `<section class="ad-sec" style="margin-top:22px"><h2>Roles</h2><div class="ad-grid2">${roles.map(r => `<div class="ad-panel"><b>${esc(r.label)}</b><p class="ad-muted" style="margin:4px 0 8px;font-size:13.5px">${esc(r.description || '')}</p>
      <div class="mono sm" style="color:var(--muted-2);font-size:12px">${r.permissions.includes('*') ? 'Everything' : r.permissions.map(esc).join(' · ')}</div></div>`).join('')}</div></section>`;
    return h;
  }
  function adminForm(email, role, active){
    const editing = !!email;
    $('#ad-modal-b').innerHTML = `<h2 id="ad-modal-h">${editing ? 'Change admin' : 'Add an admin'}</h2>
      <form class="ad-form" id="ad-admin-form">
        <div><label class="ad-lab" for="af-email">Tournza account email</label><input id="af-email" type="email" required value="${esc(email || '')}" ${editing ? 'readonly' : ''} autocomplete="off">
          ${editing ? '' : '<p class="ad-muted" style="font-size:12.5px;margin:6px 0 0">They must have signed up and confirmed their email first. They’re added switched off; once they’ve set up their 6-digit code, check the time with them and switch them on.</p>'}</div>
        <div><label class="ad-lab" for="af-role">Role</label><select id="af-role">${(A.roles || []).map(r => `<option value="${esc(r.role)}" ${r.role === (role || 'readonly') ? 'selected' : ''}>${esc(r.label)}</option>`).join('')}</select></div>
        ${editing ? `<div><label class="ad-lab" for="af-active">Access</label><select id="af-active"><option value="true" ${active ? 'selected' : ''}>On (approves the code they have now)</option><option value="false" ${active ? '' : 'selected'}>Off (no access)</option></select></div>` : ''}
        <div><label class="ad-lab" for="af-reason">Reason (kept in the audit log)</label><input id="af-reason" required minlength="3" maxlength="200" autocomplete="off"></div>
        <p class="ad-err" id="af-err"></p>
        <div class="ad-row"><button type="submit" class="ad-btn">Save</button><button type="button" class="ad-btn ghost" data-close>Cancel</button></div>
      </form>`;
    $('#ad-modal').hidden = false; $(editing ? '#af-role' : '#af-email').focus();
    $('#ad-admin-form').onsubmit = async ev => {
      ev.preventDefault();
      const btn = ev.target.querySelector('[type=submit]'); if(btn.disabled) return;   // no double submit
      btn.disabled = true; $('#af-err').textContent = '';
      try{
        const r = await rpc('admin_grant', { p_email: $('#af-email').value.trim(), p_role: $('#af-role').value,
          p_active: editing ? $('#af-active').value === 'true' : false, p_reason: $('#af-reason').value.trim() });
        if(!r || !r.ok){ $('#af-err').textContent = (r && r.error) || 'That didn’t work.'; btn.disabled = false; return; }
        closeModal(); toast('Saved — recorded in the audit log'); render();
      }catch(e){ $('#af-err').textContent = friendly(e); btn.disabled = false; }
    };
  }
  function closeModal(){ $('#ad-modal').hidden = true; $('#ad-modal-b').innerHTML = ''; }


  // =====================================================================
  // Phase 2 — actions. Every button calls one admin_* database function, which checks the permission, the
  // second login step, the reason and the "you're involved" rule itself, and writes the audit row. The page
  // only collects the choice + the reason and shows the answer.
  // =====================================================================
  const AVATAR_BASE = SUPABASE_URL + '/storage/v1/object/public/avatars/';
  const avatarUrl = p => AVATAR_BASE + String(p).split('/').map(encodeURIComponent).join('/');
  const initials = n => String(n || '?').trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase() || '?';
  const ava = (path, name, cls) => `<span class="ad-ava${cls ? ' ' + cls : ''}">${path ? `<img src="${esc(avatarUrl(path))}" alt="">` : esc(initials(name))}</span>`;
  const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');

  // one modal for every action: fields + a reason; one submit at a time; the server's answer is shown as-is
  function actionModal({ title, intro, fields = '', reasonLabel = 'Reason (kept in the audit log)', reasonValue = '', confirm, submit = 'Confirm', danger, run, done }){
    $('#ad-modal-b').innerHTML = `<h2 id="ad-modal-h">${esc(title)}</h2>${intro ? `<div class="ad-modal-intro">${intro}</div>` : ''}
      <form class="ad-form" id="ad-act-form" novalidate>${fields}
        ${reasonLabel ? `<div><label class="ad-lab" for="ax-reason">${esc(reasonLabel)}</label><input id="ax-reason" required minlength="3" maxlength="300" autocomplete="off" value="${esc(reasonValue)}"></div>` : ''}
        ${confirm ? `<label class="ad-check"><input type="checkbox" id="ax-confirm" required> <span>${confirm}</span></label>` : ''}
        <p class="ad-err" id="ax-err" role="alert"></p>
        <div class="ad-row"><button type="submit" class="ad-btn${danger ? ' danger' : ''}">${esc(submit)}</button><button type="button" class="ad-btn ghost" data-close>Cancel</button></div>
      </form>`;
    $('#ad-modal').hidden = false;
    const first = $('#ad-act-form input:not([type=hidden]), #ad-act-form select, #ad-act-form textarea'); if(first) first.focus();
    $('#ad-act-form').onsubmit = async ev => {
      ev.preventDefault();
      const f = ev.target, btn = f.querySelector('[type=submit]'); if(btn.disabled) return;
      const reason = $('#ax-reason') ? $('#ax-reason').value.trim() : '';
      if($('#ax-reason') && reason.length < 3){ $('#ax-err').textContent = 'Give a reason (at least a few words).'; return; }
      if(confirm && !$('#ax-confirm').checked){ $('#ax-err').textContent = 'Tick the box to confirm.'; return; }
      btn.disabled = true; $('#ax-err').textContent = '';
      try{
        const r = await run(f, reason);
        if(!r || !r.ok){ $('#ax-err').textContent = (r && r.error) || 'That didn’t work.'; btn.disabled = false; return; }
        closeModal(); toast((done && done(r)) || 'Done — recorded in the audit log'); render(true);
      }catch(e){ $('#ax-err').textContent = friendly(e); btn.disabled = false; }
    };
  }

  // ---------- tournaments: tie / decide / cancel ----------
  function tieModal(gid){
    const g = (A.tdata.groups || []).find(x => String(x.id) === String(gid)); if(!g) return;
    const tied = (g.table || []).filter(r => r.tied && r.position <= 2);
    const top = Math.min(...tied.map(r => r.position));
    const block = tied.filter(r => r.position === top);
    actionModal({
      title: `Group ${g.label} tie`,
      intro: `<p class="ad-muted">Still level after every tiebreak. Put the tied players in finishing order (from the bull-off). Places ${top}–${top + block.length - 1} are decided by this.</p>`,
      fields: `<ol class="ad-order" id="ax-order">${block.map(r => `<li data-id="${esc(r.player_id)}"><span>${esc(r.name)}</span>
        <span class="ad-row"><button type="button" class="ad-btn ghost sm" data-up aria-label="Move ${esc(r.name)} up">↑</button><button type="button" class="ad-btn ghost sm" data-down aria-label="Move ${esc(r.name)} down">↓</button></span></li>`).join('')}</ol>`,
      reasonLabel: 'Reason (e.g. the bull-off result)', submit: 'Confirm order',
      run: (f, reason) => rpc('admin_resolve_tie', { p_group: g.id, p_order: [...f.querySelectorAll('#ax-order li')].map(li => li.dataset.id), p_reason: reason }),
      done: () => `Group ${g.label} decided — recorded in the audit log`,
    });
  }
  function decideModal(fid){
    const f = (A.tdata.fixtures || []).find(x => String(x.id) === String(fid)); if(!f) return;
    const kind = f.status === 'void' ? 'Knockout double no-show — neither player turned up. Choose who goes through.' : 'Stalled match — no activity for 5 minutes after play began. Choose who wins (the other player forfeits).';
    actionModal({
      title: `${STAGE[f.stage] || f.stage}${f.group ? ' ' + f.group : ''}: decide`,
      intro: `<p class="ad-muted">${esc(kind)}</p>`,
      fields: `<fieldset class="ad-pick"><legend class="ad-lab">Goes through</legend>
        ${[[f.p1_id, f.p1], [f.p2_id, f.p2]].filter(x => x[0]).map(([id, n], i) => `<label><input type="radio" name="ax-win" value="${esc(id)}" ${i ? '' : 'required'}> ${esc(n)}</label>`).join('')}</fieldset>`,
      submit: 'Confirm',
      run: (form, reason) => {
        const w = form.querySelector('input[name=ax-win]:checked');
        if(!w) return { ok:false, error:'Choose who goes through.' };
        return rpc('admin_resolve_fixture', { p_fixture: f.id, p_winner: w.value, p_reason: reason });
      },
    });
  }
  function cancelModal(){
    const t = A.tdata.tournament;
    const paid = (A.tdata.payments || []).filter(p => p.status === 'paid').length;
    actionModal({
      title: 'Cancel tournament', danger: true, submit: 'Cancel tournament',
      intro: `<p><b>${esc(t.name)}</b> · ${esc(day(t.date))}</p><p class="ad-muted">It stops for everyone. Matches not yet played are voided. ${paid ? `<b>${plural(paid, 'paid place')}</b> will need refunding — they'll appear under Payments → Refunds due.` : 'No paid places to refund.'} This can't be undone from here.</p>`,
      reasonLabel: 'Reason (shown to players and kept in the audit log)',
      confirm: 'I understand this cancels the tournament for everyone',
      run: (f, reason) => rpc('admin_cancel_tournament', { p_id: t.id, p_reason: reason }),
      done: r => 'Tournament cancelled' + (r.refunds_due ? ` — ${plural(r.refunds_due, 'refund')} due (Payments)` : ''),
    });
  }

  // ---------- payments: refunds due ----------

      <div class="ad-tiles"><div class="ad-tile${rows.length ? ' alert' : ''}"><b>${rows.length}</b><span>Refunds due</span></div><div class="ad-tile"><b>${money(total)}</b><span>To refund</span></div></div>`;

      ${rows.map(r => `<tr><td>${r.player_id ? `<a href="#player:${esc(r.player_id)}">${esc(r.name || 'Player')}</a>` : '<span class="ad-muted">Unknown</span>'}<div class="sm">${esc(when(r.at))}</div></td>
        <td>${r.tournament_id ? `<a href="#tournament:${esc(r.tournament_id)}">${esc(r.tournament || '')}</a>` : '—'}<div class="sm">${esc(day(r.date))}</div></td>
        <td class="num"><b>${money(r.amount_pence)}</b></td><td class="sm hide-s">${esc(r.reason || '')}</td><td class="mono sm hide-s">…${esc(r.ref)}</td>
        <td>${can('payments.refund') ? `<button type="button" class="ad-btn ghost sm" data-refund="${esc(r.id)}">Mark refunded</button>` : ''}</td></tr>`).join('')}
      </tbody></table></div>` : `<div class="ad-clear">No refunds due.</div>`;

  function refundModal(id){
    const r = (A.refunds || []).find(x => String(x.id) === String(id)); if(!r) return;
    actionModal({
      title: 'Mark refunded',
      intro: `<p><b>${money(r.amount_pence)}</b> to ${esc(r.name || 'the player')} · ${esc(r.tournament || '')}</p>
        ${r.stripe_session_id ? `<p class="ad-muted sm">Stripe checkout: <span class="mono ad-sel">${esc(r.stripe_session_id)}</span></p>` : ''}
        <p class="ad-muted">This only records the refund — make it in Stripe first.</p>`,
      reasonValue: 'Refunded in Stripe', confirm: 'I’ve refunded this payment in Stripe', submit: 'Mark refunded',
      run: (f, reason) => rpc('admin_mark_refunded', { p_id: r.id, p_reason: reason }),
      done: () => 'Marked refunded — recorded in the audit log',

  }

      ${list.map(p => `<tr class="clk" data-go="#player:${esc(p.id)}" tabindex="0"><td><span class="ad-prow">${ava(p.avatar_path, p.name, 'sm')}<span><b>${esc(p.name)}</b>${p.email ? `<div class="sm">${esc(p.email)}</div>` : ''}</span></span></td>

      if(can('players.region')) acts.push(`<button type="button" class="ad-btn ghost sm" data-region>Change region</button>`);
    }
    let h = `<a class="ad-back" href="#players">← Players</a>
      <div class="ad-phead">${ava(p.avatar_path, p.name, 'lg')}<div><h1 class="ad-h1">${esc(p.name)}</h1>
        <p class="ad-sub">${p.suspension ? badge('refused', 'Suspended') + ' ' : ''}${p.is_admin ? badge('open', 'Admin') + ' ' : ''}${p.you ? badge('ok', 'You') + ' ' : ''}${esc(p.region || 'No region')}${p.region_since ? ' since ' + esc(day(p.region_since)) : ''} · ${p.membership ? esc(p.membership) + ' member' : 'not a member'}</p>

    if(p.picture) h += `<section class="ad-sec"><h2>Profile picture</h2><p class="ad-muted">Latest: ${badge(p.picture.status === 'pending' ? 'open' : p.picture.status === 'approved' ? 'ok' : 'refused', p.picture.status)} sent ${esc(when(p.picture.submitted_at))}${p.picture.reason ? ' — ' + esc(p.picture.reason) : ''}${p.picture.status === 'pending' && can('pictures.review') ? ' · <a href="#pictures">Review →</a>' : ''}</p></section>`;

      ${p.notes.length ? `<ul class="ad-notes">${p.notes.map(n => `<li><div class="sm ad-muted">${esc(when(n.at))} · ${esc(n.by || '—')}</div><div class="ad-note-b">${esc(n.body)}</div></li>`).join('')}</ul>` : ''}</section>`;
    h += `<section class="ad-sec"><h2>Results <span class="c">${(p.results || []).length || ''}</span></h2>${(p.results || []).length ? `<div class="ad-tw"><table class="ad-t"><thead><tr><th>Date</th><th>Tournament</th><th>Finish</th><th class="num">Points</th></tr></thead><tbody>

      ${p.entries.map(e => `<tr class="clk" data-go="#tournament:${e.tournament_id}" tabindex="0"><td class="sm">${esc(day(e.date))}</td><td>${esc(e.name)} ${badge(e.phase)}</td><td>${badge(e.payment_status)}</td><td class="hide-s">${e.checked_in ? 'Yes' : 'No'}</td></tr>`).join('')}
      </tbody></table></div>` : '<div class="ad-clear">No entries.</div>'}</section>`;
    if(p.history) h += `<section class="ad-sec"><h2>Admin history</h2>${p.history.length ? `<div class="ad-tw"><table class="ad-t"><tbody>${p.history.map(a => `<tr><td class="sm">${esc(when(a.at))}</td><td>${esc(a.who)}</td><td class="mono sm">${esc(a.action)}</td><td>${badge(a.outcome)}</td><td class="sm">${esc(a.reason || '')}</td></tr>`).join('')}</tbody></table></div>` : '<div class="ad-clear">No admin actions on this player.</div>'}</section>`;
    h += `<p class="ad-muted sm">Account created ${esc(when(p.signed_up))} · id <span class="mono">${esc(p.id)}</span></p>`;
    return h;
  }
  function suspendModal(){
    const p = A.pdata;
    actionModal({
      title: 'Suspend player', danger: true, submit: 'Suspend',
      intro: `<p><b>${esc(p.name)}</b></p><p class="ad-muted">They won’t be able to enter or pay for tournaments, check in, or play Friendlies, and they’ll be hidden from the public rankings and player pages. Their points are kept. They’ll see: “Your account is suspended — contact admin@tournza.co.uk”.</p>`,
      reasonLabel: 'Reason (kept in the audit log — not shown to the player)',
      run: (f, reason) => rpc('admin_suspend', { p_player: p.id, p_reason: reason }),
      done: r => 'Suspended' + (r.upcoming_paid && r.upcoming_paid.length ? ` — ${plural(r.upcoming_paid.length, 'paid place')} to decide on` : ''),
    });
  }
  function reinstateModal(){
    const p = A.pdata;
    actionModal({
      title: 'Reinstate player', submit: 'Reinstate',
      intro: `<p><b>${esc(p.name)}</b> — suspended: ${esc(p.suspension ? p.suspension.reason : '')}</p><p class="ad-muted">Everything comes back, including their points on the rankings.</p>`,
      run: (f, reason) => rpc('admin_reinstate', { p_player: p.id, p_reason: reason }),
    });
  }
  async function regionModal(){
    const p = A.pdata;
    let regions = [];
    try{ const r = await A.sb.rpc('uk_regions_list'); regions = r.data || []; }catch(_){}
    if(!regions.length) regions = ['Midlands','North West','Northern Ireland','Wales','South West','South East & London','East of England','Yorkshire & Humber','North East','Scotland'];
    actionModal({
      title: 'Change region', submit: 'Move player',
      intro: `<p><b>${esc(p.name)}</b> · now ${esc(p.region || 'not set')}</p><p class="ad-muted">National points stay. Their regional table starts again in the new region from today. Not possible while they’re entered in an upcoming or live tournament.</p>`,
      fields: `<div><label class="ad-lab" for="ax-region">New region</label><select id="ax-region" required><option value="">Choose…</option>${regions.filter(r => r !== p.region).map(r => `<option>${esc(r)}</option>`).join('')}</select></div>`,
      run: (f, reason) => { const r = $('#ax-region').value; if(!r) return { ok:false, error:'Choose the new region.' }; return rpc('admin_change_region', { p_player: p.id, p_region: r, p_reason: reason }); },
      done: () => 'Region changed — recorded in the audit log',
    });
  }

  // ---------- profile pictures ----------
  async function viewPictures(){
    const tab = A.arg === 'decided' ? 'decided' : 'pending';
    const rows = await rpc('admin_pictures', { p_status: tab });
    A.pics = rows;
    const over = rows.filter(r => tab === 'pending' && r.hours_waiting >= 72).length;
    const n = $('#ad-n-pictures'); if(n && tab === 'pending'){ n.hidden = !rows.length; n.textContent = rows.length; }
    let h = `<h1 class="ad-h1">Profile pictures</h1><p class="ad-sub">Review within 72 hours. Approve only if it’s the player or darts-related — no offensive content, nudity, other people, logos they don’t own, or contact details.</p>
      <div class="ad-tabs" role="group" aria-label="Show"><button type="button" data-ptab="pending" class="${tab === 'pending' ? 'on' : ''}" aria-pressed="${tab === 'pending'}">Waiting${tab === 'pending' && rows.length ? ' (' + rows.length + ')' : ''}</button><button type="button" data-ptab="decided" class="${tab === 'decided' ? 'on' : ''}" aria-pressed="${tab === 'decided'}">Decided</button></div>`;
    if(over) h += `<div class="ad-banner">${plural(over, 'picture')} waiting over 72 hours.</div>`;
    if(!rows.length) return h + `<div class="ad-clear">${tab === 'pending' ? 'Nothing waiting.' : 'No decisions yet.'}</div>`;
    h += `<div class="ad-pics">${rows.map(r => {
      const age = r.hours_waiting >= 72 ? 'over' : r.hours_waiting >= 48 ? 'soon' : '';
      return `<article class="ad-pic" data-pic="${esc(r.id)}">
        <div class="ad-pic-img" data-pic-img="${esc(tab === 'pending' ? r.path : '')}" data-pic-pub="${esc(r.status === 'approved' && r.current_path ? r.current_path : '')}"><span class="ad-muted sm">${tab === 'pending' ? 'Loading…' : r.status === 'approved' ? '' : 'Removed'}</span></div>
        <div class="ad-pic-b"><b><a href="#player:${esc(r.player_id)}">${esc(r.name)}</a></b>
          <div class="sm ad-muted">Sent ${esc(when(r.submitted_at))}</div>
          ${tab === 'pending' ? `<div class="ad-age ${age}">${r.hours_waiting < 1 ? 'Under an hour' : Math.floor(r.hours_waiting) + 'h'} waiting${age === 'over' ? ' — overdue' : ''}</div>
            ${r.current_path ? `<div class="sm ad-muted ad-cur">Current: ${ava(r.current_path, r.name, 'sm')}</div>` : ''}
            ${r.you ? '<div class="sm ad-muted">Your own picture — another admin reviews it.</div>' : `<div class="ad-row"><button type="button" class="ad-btn sm" data-approve="${esc(r.id)}">Approve</button><button type="button" class="ad-btn ghost sm" data-reject="${esc(r.id)}">Reject</button></div>`}`
          : `<div>${badge(r.status === 'approved' ? 'ok' : 'refused', r.status)}</div><div class="sm ad-muted">${esc(r.decided_by || '')} · ${esc(when(r.decided_at))}</div>${r.reason ? `<div class="sm">${esc(r.reason)}</div>` : ''}`}
        </div></article>`; }).join('')}</div>`;
    return h;
  }
  // pictures waiting are private: show them through short-lived signed links (reviewing admins only)
  async function hydratePictures(){
    for(const el of document.querySelectorAll('[data-pic-img], [data-pic-pub]')){
      const path = el.dataset.picImg, pub = el.dataset.picPub;
      if(pub){ el.innerHTML = `<img src="${esc(avatarUrl(pub))}" alt="">`; continue; }
      if(!path) continue;
      try{
        const { data, error } = await A.sb.storage.from('avatars-pending').createSignedUrl(path, 900);
        if(error || !data) throw error || new Error('no link');
        el.innerHTML = `<img src="${esc(data.signedUrl)}" alt="Picture waiting for review">`;
      }catch(_){ el.innerHTML = '<span class="ad-muted sm">Couldn’t load the picture</span>'; }
    }
  }
  async function approvePicture(id, btn){
    const r = (A.pics || []).find(x => String(x.id) === String(id)); if(!r) return;
    btn.disabled = true; btn.textContent = 'Approving…';
    try{
      const ext = (r.path.match(/\.[a-z]+$/) || ['.webp'])[0];
      const dest = `${r.player_id}/${r.id}${ext}`;
      const dl = await A.sb.storage.from('avatars-pending').download(r.path);
      if(dl.error) throw dl.error;
      const up = await A.sb.storage.from('avatars').upload(dest, dl.data, { contentType: dl.data.type || (ext === '.webp' ? 'image/webp' : ext === '.png' ? 'image/png' : 'image/jpeg'), upsert: false });
      if(up.error && !/exist|duplicate/i.test(up.error.message || '')) throw up.error;
      const res = await rpc('admin_picture_decide', { p_id: r.id, p_approve: true, p_reason: null });
      if(!res || !res.ok) throw new Error((res && res.error) || 'Couldn’t approve it');
      A.sb.storage.from('avatars-pending').remove([r.path]).catch(() => {});      // tidy up the private copy
      toast('Approved — it’s now on their profile'); render(true);
    }catch(e){ btn.disabled = false; btn.textContent = 'Approve'; toast(friendly(e), true); }
  }
  function rejectModal(id){
    const r = (A.pics || []).find(x => String(x.id) === String(id)); if(!r) return;
    actionModal({
      title: 'Reject picture', submit: 'Reject',
      intro: `<p><b>${esc(r.name)}</b></p><p class="ad-muted">Their current picture stays. They’ll see your reason on their account page.</p>`,
      reasonLabel: 'Reason (shown to the player)',
      fields: `<div class="ad-row">${['Shows another person','Not you or darts-related','Offensive or unsuitable','Contains a logo or contact details'].map(t => `<button type="button" class="ad-btn ghost sm" data-reason-chip="${esc(t)}">${esc(t)}</button>`).join('')}</div>`,
      run: async (f, reason) => {
        const res = await rpc('admin_picture_decide', { p_id: r.id, p_approve: false, p_reason: reason });
        if(res && res.ok) A.sb.storage.from('avatars-pending').remove([r.path]).catch(() => {});
        return res;
      },
      done: () => 'Rejected — the player will see why',
    });
  }

  function opsClick(t){
    if(t.matches('[data-tie]')){ tieModal(t.dataset.tie); return true; }
    if(t.matches('[data-decide]')){ decideModal(t.dataset.decide); return true; }
    if(t.matches('[data-cancel-t]')){ cancelModal(); return true; }
    if(t.matches('[data-refund]')){ refundModal(t.dataset.refund); return true; }
    if(t.matches('[data-suspend]')){ suspendModal(); return true; }
    if(t.matches('[data-reinstate]')){ reinstateModal(); return true; }
    if(t.matches('[data-region]')){ regionModal(); return true; }
    if(t.matches('[data-approve]')){ approvePicture(t.dataset.approve, t); return true; }
    if(t.matches('[data-reject]')){ rejectModal(t.dataset.reject); return true; }
    if(t.matches('[data-reason-chip]')){ $('#ax-reason').value = t.dataset.reasonChip; return true; }
    if(t.matches('[data-pfilter]')){ location.hash = '#players' + (t.dataset.pfilter === 'suspended' ? ':suspended' : ''); return true; }
    if(t.matches('[data-ptab]')){ location.hash = '#pictures' + (t.dataset.ptab === 'decided' ? ':decided' : ''); return true; }
    if(t.matches('[data-up], [data-down]')){
      const li = t.closest('li'), up = t.matches('[data-up]');
      const sib = up ? li.previousElementSibling : li.nextElementSibling;
      if(sib){ up ? li.parentNode.insertBefore(li, sib) : li.parentNode.insertBefore(sib, li); t.focus(); }
      return true;
    }
    return false;
  }
  document.addEventListener('submit', async e => {
    if(e.target.id === 'ad-psearch'){ e.preventDefault(); A.pq = $('#ad-pq').value.trim(); render(); return; }
    if(e.target.id === 'ad-note-form'){
      e.preventDefault();
      const btn = e.target.querySelector('[type=submit]'); if(btn.disabled) return;
      const body = $('#ad-note').value.trim(); if(!body) return;
      btn.disabled = true;
      try{
        const r = await rpc('admin_add_note', { p_player: A.pdata.id, p_body: body });
        if(!r || !r.ok){ $('#ad-note-err').textContent = (r && r.error) || 'That didn’t work.'; btn.disabled = false; return; }
        toast('Note added'); render(true);
      }catch(err){ $('#ad-note-err').textContent = friendly(err); btn.disabled = false; }
    }
  });


  // ---------------- events ----------------
  document.addEventListener('click', async e => {
    const t = e.target.closest('button, tr[data-go], a');
    if(!t) return;
    if(opsClick(t)) return;
    if(t.matches('[data-ad-signout]')){ await A.sb.auth.signOut(); location.href = '/'; return; }
    if(t.matches('tr[data-go]')){ location.hash = t.dataset.go; return; }
    if(t.matches('[data-filter]')){ A.filter = t.dataset.filter; A.q = ''; $('#ad-q').value = ''; location.hash = '#tournaments:' + A.filter; if(A.view === 'tournaments') render(); return; }
    if(t.matches('[data-clear-q]')){ A.q = ''; $('#ad-q').value = ''; render(); return; }
    if(t.id === 'ad-refresh'){ render(); return; }
    if(t.matches('[data-add-admin]')){ adminForm(); return; }
    if(t.matches('[data-edit-admin]')){ adminForm(t.dataset.editAdmin, t.dataset.role, t.dataset.active === 'true'); return; }
    if(t.matches('[data-close]')){ closeModal(); return; }
  });
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && !$('#ad-modal').hidden) closeModal();
    const tr = e.target.closest && e.target.closest('tr[data-go]');
    if(tr && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); location.hash = tr.dataset.go; }
  });
  $('#ad-search').addEventListener('submit', e => { e.preventDefault(); A.q = $('#ad-q').value.trim(); if(location.hash.startsWith('#tournaments')) render(); else location.hash = '#tournaments'; });
  $('#ad-modal').addEventListener('click', e => { if(e.target.id === 'ad-modal') closeModal(); });
  boot();
})();

</script>
</body>
</html>
